name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests need no model weights and no GPU.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install "transformers>=4.45,<5" "accelerate>=1.0" "scikit-learn>=1.5" "fastapi>=0.115" "httpx>=0.27" "pytest>=8"
      - run: python -m pytest -q
