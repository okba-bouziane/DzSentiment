[project]
name = "dzsentiment"
version = "0.1.0"
description = "Sentiment classifier for customer text in Algerian Darija, Arabic, French and English, fine-tuned and evaluated against baselines."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45,<5",
  "datasets>=3.0",
  "scikit-learn>=1.5",
  "accelerate>=1.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "openai>=1.50",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
